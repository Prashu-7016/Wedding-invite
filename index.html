<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swathi & Mohan Kumar Wedding</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Icons to replace Lucide dependencies for the standalone HTML file
        const Sparkles = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
        );
        const X = ({ size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );
        const MapPin = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        );
        const Navigation = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        );

        // Falling gold dust particles component
        const GoldDust = () => {
            const particles = Array.from({ length: 30 });
            return (
                <div className="fixed inset-0 pointer-events-none z-30 overflow-hidden">
                    {particles.map((_, i) => (
                        <div
                            key={i}
                            className="absolute rounded-full gold-gradient-bg"
                            style={{
                                width: Math.random() * 4 + 2 + 'px',
                                height: Math.random() * 4 + 2 + 'px',
                                left: Math.random() * 100 + 'vw',
                                top: -10,
                                opacity: Math.random() * 0.5 + 0.3,
                                animation: `fall ${Math.random() * 10 + 10}s linear infinite`,
                                animationDelay: `-${Math.random() * 15}s`,
                            }}
                        />
                    ))}
                </div>
            );
        };

        const App = () => {
            const [inviteState, setInviteState] = useState('sealed'); 
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [currentSlide, setCurrentSlide] = useState(0); 
            const [startLocation, setStartLocation] = useState(''); // NEW STATE FOR LOCATION

            // Wedding Date
            const weddingDate = new Date('June 24, 2026 09:00:00').getTime();

            // Countdown Timer Logic
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = weddingDate - now;

                    if (distance < 0) {
                        clearInterval(timer);
                        return;
                    }

                    setTimeLeft({
                        days: Math.floor(distance / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                        minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                        seconds: Math.floor((distance % (1000 * 60)) / 1000)
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            // Cinematic Slideshow Logic (Changes slide every 4 seconds)
            useEffect(() => {
                const slideInterval = setInterval(() => {
                    setCurrentSlide(prev => (prev + 1) % 8);
                }, 4000);
                return () => clearInterval(slideInterval);
            }, []);

            // Sliding Doors Animation Logic
            const handleOpen = () => {
                setInviteState('opening');
                setTimeout(() => {
                    setInviteState('opened');
                    window.scrollTo(0, 0);
                }, 1200);
            };

            const handleClose = () => {
                setInviteState('sealed');
                setTimeout(() => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 1000);
            };

            // NEW FUNCTION: Handle Google Maps Routing
            const handleGetDirections = () => {
                if (startLocation.trim() === '') {
                    // If they leave it blank, just show the venue on the map
                    window.open("https://maps.google.com/?q=Sri+Hari+Convention+Hall,+Chikka+Tirupati", "_blank");
                } else {
                    // If they type a location, open Google Maps with the route from their location to the venue
                    const origin = encodeURIComponent(startLocation);
                    const destination = encodeURIComponent("Sri Hari Convention Hall, Chikka Tirupati");
                    window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`, "_blank");
                }
            };

            return (
                <div className="min-h-[100dvh] w-full max-w-[100vw] bg-[#3f0f18] text-[#d4af37] font-sans selection:bg-[#d4af37] selection:text-[#3f0f18] overflow-x-hidden relative">
                    <style dangerouslySetInnerHTML={{__html: `
                        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Lato:wght@300;400;700&display=swap');
                        
                        .font-serif-lux { font-family: 'Cinzel', serif; }
                        .font-sans-lux { font-family: 'Lato', sans-serif; }
                        .font-script { font-family: 'Great Vibes', cursive; }
                        
                        .gold-gradient-text {
                            background: linear-gradient(to bottom, #fceabb 0%, #f8b500 50%, #d4af37 100%);
                            -webkit-background-clip: text;
                            -webkit-text-fill-color: transparent;
                        }
                        .gold-gradient-bg {
                            background: linear-gradient(135deg, #d4af37 0%, #ffdf73 50%, #b8860b 100%);
                        }
                        
                        @keyframes fadeInUp {
                            from { opacity: 0; transform: translateY(30px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                        .animate-fade-in-up {
                            animation: fadeInUp 1s ease forwards;
                        }
                        
                        @keyframes fall {
                            0% { transform: translateY(-10vh) translateX(0px) rotate(0deg); }
                            50% { transform: translateY(50vh) translateX(20px) rotate(180deg); }
                            100% { transform: translateY(110vh) translateX(-20px) rotate(360deg); }
                        }

                        /* Cinematic Slow Zoom Effect */
                        @keyframes ken-burns {
                            0% { transform: scale(1); }
                            100% { transform: scale(1.15); }
                        }
                        .animate-ken-burns {
                            animation: ken-burns 8s ease-out infinite alternate;
                        }
                        
                        .glow-box {
                            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(212, 175, 55, 0.05);
                        }
                    `}} />

                    {/* --- SEAL & DOORS OVERLAY --- */}
                    <div className={`fixed inset-0 z-50 flex items-center justify-center transition-all duration-1000 ${inviteState === 'opened' ? 'pointer-events-none' : ''}`}>
                        
                        <div className={`absolute inset-y-0 left-0 w-1/2 bg-[#2d0a11] border-r-[1px] md:border-r-2 border-[#d4af37]/40 transition-transform duration-[1200ms] ease-in-out ${inviteState !== 'sealed' ? '-translate-x-full' : 'translate-x-0'}`}>
                            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-30"></div>
                        </div>

                        <div className={`absolute inset-y-0 right-0 w-1/2 bg-[#2d0a11] border-l-[1px] md:border-l-2 border-[#d4af37]/40 transition-transform duration-[1200ms] ease-in-out ${inviteState !== 'sealed' ? 'translate-x-full' : 'translate-x-0'}`}>
                            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-30"></div>
                        </div>

                        <div onClick={handleOpen} className={`relative z-50 flex flex-col items-center justify-center cursor-pointer transition-all duration-700 ${inviteState !== 'sealed' ? 'opacity-0 scale-150 blur-md' : 'opacity-100 scale-100 hover:scale-105'}`}>
                            <div className="w-28 h-28 sm:w-36 sm:h-36 md:w-44 md:h-44 rounded-full gold-gradient-bg flex items-center justify-center shadow-[0_0_50px_rgba(212,175,55,0.4)] border-[4px] md:border-[6px] border-[#2d0a11] ring-2 ring-[#d4af37]">
                                <span className="font-serif-lux text-4xl sm:text-5xl md:text-6xl text-[#2d0a11] font-bold tracking-wider">S<span className="font-script text-2xl sm:text-3xl mx-1">&</span>M</span>
                            </div>
                            <p className="mt-6 md:mt-8 font-sans-lux uppercase tracking-[0.2em] md:tracking-[0.3em] text-[#d4af37] text-xs md:text-sm animate-pulse flex items-center gap-2 font-bold">
                                <Sparkles size={14} className="md:w-4 md:h-4" /> Tap to Unseal <Sparkles size={14} className="md:w-4 md:h-4" />
                            </p>
                        </div>
                    </div>

                    {/* --- MAIN INVITATION CONTENT --- */}
                    <div className={`transition-opacity duration-1000 delay-500 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] ${inviteState === 'opened' ? 'opacity-100 min-h-[100dvh] flex flex-col items-center justify-start p-3 sm:p-4 pt-16 md:pt-16 pb-24' : 'opacity-0 h-screen overflow-hidden'}`}>
                        
                        {inviteState === 'opened' && <GoldDust />}

                        <div className={`fixed top-3 right-3 sm:top-4 sm:right-4 md:top-8 md:right-8 z-40 flex items-center gap-2 sm:gap-4 transition-all duration-1000 delay-1000 ${inviteState === 'opened' ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-10 pointer-events-none'}`}>
                            <button onClick={handleClose} className="p-2 sm:p-3 rounded-full bg-[#2d0a11] border border-[#d4af37]/50 text-[#d4af37] hover:bg-[#d4af37] hover:text-[#2d0a11] transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)]" aria-label="Close Invitation">
                                <X size={20} />
                            </button>
                        </div>

                        <div className="relative z-20 max-w-xl w-full mx-auto shadow-[0_10px_30px_rgba(0,0,0,0.8)] sm:shadow-[0_20px_50px_rgba(0,0,0,0.8)] rounded-xl overflow-hidden border-[3px] sm:border-[4px] md:border-[6px] border-[#d4af37] bg-[#2d0a11] mt-12 sm:mt-10 md:mt-0 opacity-0 animate-fade-in-up" style={{ animationDelay: '0.8s' }}>
                            <img 
                                src="1000102949.jpg" 
                                onError={(e) => {
                                    e.target.onerror = null; 
                                    e.target.src = "https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=1000&auto=format&fit=crop"; 
                                }}
                                alt="Swathi & Mohan Kumar Wedding Invitation" 
                                className="w-full h-auto object-cover block relative z-10"
                            />
                            <div className="absolute inset-0 bg-gradient-to-tr from-transparent via-[#d4af37]/10 to-transparent opacity-0 hover:opacity-100 transition-opacity duration-700 pointer-events-none z-20"></div>
                        </div>

                        <div className="w-full max-w-xl mt-8 sm:mt-12 opacity-0 animate-fade-in-up space-y-4 sm:space-y-6 relative z-20" style={{ animationDelay: '1.0s' }}>
                            <div className="bg-[#091f24] border border-[#d4af37]/30 rounded-[20px] sm:rounded-[30px] p-5 sm:p-6 md:p-8 text-center glow-box relative overflow-hidden">
                                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-20"></div>
                                <h3 className="font-serif-lux text-lg sm:text-xl md:text-2xl mb-4 sm:mb-6 text-[#d4af37] relative z-10">The Countdown</h3>
                                <div className="flex flex-wrap justify-center gap-2 sm:gap-4 md:gap-8 font-serif-lux relative z-10">
                                    {[
                                        { label: 'Days', value: timeLeft.days },
                                        { label: 'Hours', value: timeLeft.hours },
                                        { label: 'Minutes', value: timeLeft.minutes },
                                        { label: 'Seconds', value: timeLeft.seconds }
                                    ].map((item, idx) => (
                                        <div key={idx} className="flex flex-col items-center w-12 sm:w-14 md:w-16">
                                            <div className="text-2xl sm:text-3xl md:text-4xl text-[#d4af37] mb-1 font-bold drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">{item.value.toString().padStart(2, '0')}</div>
                                            <div className="text-[9px] sm:text-[10px] md:text-xs font-sans-lux uppercase tracking-[0.1em] sm:tracking-[0.2em] text-[#d4af37]/70">{item.label}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-[#2d0a11]/80 border border-[#d4af37]/30 rounded-[20px] sm:rounded-[30px] p-5 sm:p-6 md:p-8 text-center backdrop-blur-sm glow-box">
                                <h3 className="font-serif-lux text-xl sm:text-2xl md:text-3xl mb-1 sm:mb-2 text-[#d4af37]">June 2026</h3>
                                <p className="font-sans-lux text-[#d4af37]/70 text-[10px] sm:text-xs tracking-[0.15em] sm:tracking-[0.2em] mb-4 sm:mb-6 uppercase">Mark Your Calendar</p>
                                
                                <div className="max-w-[240px] sm:max-w-[280px] mx-auto">
                                    <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-2 sm:mb-3 font-serif-lux text-[#d4af37]/50 text-[9px] sm:text-[10px] md:text-xs tracking-widest">
                                        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-y-2 sm:gap-y-3 gap-x-1 sm:gap-x-2 font-sans-lux text-xs sm:text-sm md:text-base text-[#d4af37]">
                                        <div></div>
                                        {[...Array(30)].map((_, i) => {
                                            const day = i + 1;
                                            const isReception = day === 23;
                                            const isMurtham = day === 24;
                                            const isEventDay = isReception || isMurtham;
                                            return (
                                                <div key={day} className={`h-7 w-7 sm:h-8 sm:w-8 md:h-10 md:w-10 mx-auto flex items-center justify-center rounded-full transition-all duration-300 relative group ${isEventDay ? 'gold-gradient-bg text-[#2d0a11] font-bold shadow-[0_0_10px_rgba(212,175,55,0.6)] animate-pulse scale-110' : 'hover:bg-[#d4af37]/10'}`}>
                                                    {day}
                                                    {isEventDay && (
                                                        <span className="absolute -top-7 sm:-top-8 left-1/2 -translate-x-1/2 bg-[#091f24] text-[#d4af37] text-[9px] sm:text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap border border-[#d4af37]/30 pointer-events-none z-10 shadow-lg">
                                                            {isReception ? 'Reception' : 'Muhurtham'}
                                                        </span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row justify-center items-center gap-3 sm:gap-6 mt-6 sm:mt-8 font-sans-lux text-[10px] sm:text-xs md:text-sm text-[#d4af37]/80">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full gold-gradient-bg shadow-[0_0_10px_rgba(212,175,55,0.6)]"></div>
                                        <span>23rd - Reception</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full gold-gradient-bg shadow-[0_0_10px_rgba(212,175,55,0.6)]"></div>
                                        <span>24th - Muhurtham</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* --- CINEMATIC SLIDESHOW GALLERY --- */}
                        <div className="w-full max-w-xl mt-6 sm:mt-8 opacity-0 animate-fade-in-up relative z-20" style={{ animationDelay: '1.2s' }}>
                            <div className="bg-[#2d0a11]/80 border border-[#d4af37]/30 rounded-[20px] sm:rounded-[30px] p-5 sm:p-8 text-center backdrop-blur-sm glow-box relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 gold-gradient-bg z-20"></div>
                                <h3 className="font-serif-lux text-2xl sm:text-3xl mb-4 sm:mb-6 text-[#d4af37] relative z-20">Pre-Wedding Moments</h3>
                                
                                {/* Cinematic Container */}
                                <div className="relative w-full aspect-[4/5] sm:aspect-square md:aspect-[4/3] rounded-xl overflow-hidden border-[2px] sm:border-[3px] border-[#d4af37]/50 shadow-[0_10px_30px_rgba(0,0,0,0.8)]">
                                    {[1, 2, 3, 4, 5, 6, 7, 8].map((num, index) => (
                                        <div 
                                            key={num} 
                                            className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${currentSlide === index ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}
                                        >
                                            <img 
                                                src={`pre-wed-${num}.jpg`}
                                                onError={(e) => {
                                                    e.target.onerror = null;
                                                    const placeholders = [
                                                        "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=800&auto=format&fit=crop",
                                                        "https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=800&auto=format&fit=crop",
                                                        "https://images.unsplash.com/photo-1520854221256-17451cc331bf?q=80&w=800&auto=format&fit=crop",
                                                        "https://images.unsplash.com/photo-1606800052052-a08af7148866?q=80&w=800&auto=format&fit=crop",
                                                        "https://images.unsplash.com/photo-1542037104857-ffbb0b9155fb?q=80&w=800&auto=format&fit=crop",
                                                        "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?q=80&w=800&auto=format&fit=crop",
                                                        "https://images.unsplash.com/photo-1621508670154-802c67531475?q=80&w=800&auto=format&fit=crop",
                                                        "https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=800&auto=format&fit=crop"
                                                    ];
                                                    e.target.src = placeholders[num - 1]; 
                                                }}
                                                alt={`Pre-wedding ${num}`}
                                                className="w-full h-full object-cover animate-ken-burns"
                                            />
                                            <div className="absolute inset-x-0 bottom-0 h-1/3 bg-gradient-to-t from-black/60 to-transparent"></div>
                                        </div>
                                    ))}

                                    {/* Slide Progress Dots */}
                                    <div className="absolute bottom-4 left-0 right-0 flex justify-center gap-2 sm:gap-3 z-20">
                                        {[0,1,2,3,4,5,6,7].map(idx => (
                                            <div 
                                                key={idx} 
                                                className={`h-1.5 sm:h-2 rounded-full transition-all duration-500 shadow-[0_0_5px_rgba(0,0,0,0.8)] ${currentSlide === idx ? 'w-6 sm:w-8 bg-[#d4af37]' : 'w-1.5 sm:w-2 bg-[#d4af37]/40'}`}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Location Section */}
                        <div className="w-full max-w-xl mt-6 sm:mt-8 opacity-0 animate-fade-in-up relative z-20" style={{ animationDelay: '1.4s' }}>
                            <div className="bg-[#2d0a11]/80 border border-[#d4af37]/30 rounded-[20px] sm:rounded-3xl p-6 sm:p-8 text-center backdrop-blur-sm glow-box relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 gold-gradient-bg"></div>
                                <div className="w-12 h-12 sm:w-14 sm:h-14 mx-auto rounded-full bg-[#091f24] border border-[#d4af37]/50 flex items-center justify-center mb-4 sm:mb-6">
                                    <MapPin className="text-[#d4af37] w-5 h-5 sm:w-6 sm:h-6" />
                                </div>
                                <h3 className="font-serif-lux text-2xl sm:text-3xl mb-2 sm:mb-3 text-[#d4af37]">Wedding Venue</h3>
                                <p className="font-sans-lux text-[#d4af37]/80 text-xs sm:text-sm md:text-base mb-6 sm:mb-8 leading-relaxed">
                                    <strong>Sri Hari Convention Hall</strong><br/>
                                    Chikka Tirupati<br/>
                                    Karnataka
                                </p>
                                
                                {/* New Interactive Route Input */}
                                <div className="mt-2 flex flex-col sm:flex-row gap-3 justify-center items-center w-full">
                                    <input 
                                        type="text" 
                                        placeholder="Enter starting location (e.g., Sarjapur)" 
                                        value={startLocation}
                                        onChange={(e) => setStartLocation(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleGetDirections()}
                                        className="bg-[#091f24] border border-[#d4af37]/50 text-[#d4af37] placeholder-[#d4af37]/50 px-5 py-3 sm:py-4 rounded-full text-[10px] sm:text-xs w-full focus:outline-none focus:border-[#d4af37] focus:ring-1 focus:ring-[#d4af37] transition-all"
                                    />
                                    <button 
                                        onClick={handleGetDirections}
                                        className="inline-flex items-center justify-center gap-2 sm:gap-3 px-6 sm:px-8 py-3 sm:py-4 font-serif-lux tracking-[0.1em] sm:tracking-[0.2em] text-[10px] sm:text-xs uppercase text-[#2d0a11] font-bold gold-gradient-bg rounded-full hover:scale-105 transition-transform shadow-[0_4px_15px_rgba(212,175,55,0.3)] w-full sm:w-auto whitespace-nowrap"
                                    >
                                        <Navigation size={14} className="sm:w-4 sm:h-4 shrink-0" /> Route
                                    </button>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
