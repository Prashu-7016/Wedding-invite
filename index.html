<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swathi & Mohan Kumar Wedding</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <style>
        .font-serif-lux { font-family: 'Cinzel', serif; }
        .font-sans-lux  { font-family: 'Lato', sans-serif; }
        .font-script    { font-family: 'Great Vibes', cursive; }

        .gold-gradient-text {
            background: linear-gradient(to bottom, #fceabb 0%, #f8b500 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-gradient-bg {
            background: linear-gradient(135deg, #d4af37 0%, #ffdf73 50%, #b8860b 100%);
        }
        .glow-box {
            box-shadow: 0 0 30px rgba(212,175,55,0.15), inset 0 0 20px rgba(212,175,55,0.05);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) translateX(0px)   rotate(0deg);   }
            50%  { transform: translateY(50vh)  translateX(20px)  rotate(180deg); }
            100% { transform: translateY(110vh) translateX(-20px) rotate(360deg); }
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #3f0f18; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Sparkles = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size||24} height={size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
            </svg>
        );
        const X = ({ size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size||24} height={size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
        );
        const MapPin = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size||24} height={size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
            </svg>
        );
        const Navigation = ({ size, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size||24} height={size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="3 11 22 2 13 21 11 13 3 11"/>
            </svg>
        );

        const PARTICLES = Array.from({ length: 30 }, (_, i) => ({
            w: (((i * 7 + 3) % 4) + 2),
            h: (((i * 11 + 5) % 4) + 2),
            l: ((i * 37 + 13) % 100),
            o: (((i * 17 + 7) % 5) / 10) + 0.3,
            d: (((i * 13 + 3) % 10) + 10),
            delay: -((i * 11 + 2) % 15),
        }));

        const GoldDust = () => (
            <div className="fixed inset-0 pointer-events-none z-30 overflow-hidden">
                {PARTICLES.map((p, i) => (
                    <div key={i} className="absolute rounded-full gold-gradient-bg" style={{
                        width: p.w + 'px', height: p.h + 'px',
                        left: p.l + 'vw', top: -10,
                        opacity: p.o,
                        animation: `fall ${p.d}s linear infinite`,
                        animationDelay: `${p.delay}s`,
                    }} />
                ))}
            </div>
        );

        const App = () => {
            const [inviteState, setInviteState] = useState('sealed');
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [startLocation, setStartLocation] = useState('');

            const weddingDate = new Date('June 24, 2026 04:40:00').getTime();

            useEffect(() => {
                const tick = () => {
                    const distance = weddingDate - Date.now();
                    if (distance < 0) return;
                    setTimeLeft({
                        days:    Math.floor(distance / 86400000),
                        hours:   Math.floor((distance % 86400000) / 3600000),
                        minutes: Math.floor((distance % 3600000)  / 60000),
                        seconds: Math.floor((distance % 60000)    / 1000),
                    });
                };
                tick();
                const timer = setInterval(tick, 1000);
                return () => clearInterval(timer);
            }, []);

            const handleOpen = () => {
                setInviteState('opening');
                setTimeout(() => { setInviteState('opened'); window.scrollTo(0, 0); }, 1200);
            };
            const handleClose = () => {
                setInviteState('sealed');
                setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 1000);
            };
            const handleGetDirections = () => {
                const dest = encodeURIComponent("Sri Hari Convention Hall, Chikka Tirupati");
                if (!startLocation.trim()) {
                    window.open(`https://www.google.com/maps/search/?api=1&query=${dest}`, "_blank");
                } else {
                    window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(startLocation)}&destination=${dest}`, "_blank");
                }
            };

            return (
                <div className="min-h-screen w-full bg-[#3f0f18] text-[#d4af37] overflow-x-hidden relative" style={{fontFamily:'Lato,sans-serif'}}>

                    {/* DOORS OVERLAY */}
                    <div className={`fixed inset-0 z-50 flex items-center justify-center transition-all duration-1000 ${inviteState === 'opened' ? 'pointer-events-none' : ''}`}>
                        <div className={`absolute inset-y-0 left-0 w-1/2 bg-[#2d0a11] border-r border-[#d4af37]/40 transition-transform duration-[1200ms] ease-in-out ${inviteState !== 'sealed' ? '-translate-x-full' : 'translate-x-0'}`}>
                            <div className="absolute inset-0 opacity-30" style={{backgroundImage:"url('https://www.transparenttextures.com/patterns/stardust.png')"}}></div>
                        </div>
                        <div className={`absolute inset-y-0 right-0 w-1/2 bg-[#2d0a11] border-l border-[#d4af37]/40 transition-transform duration-[1200ms] ease-in-out ${inviteState !== 'sealed' ? 'translate-x-full' : 'translate-x-0'}`}>
                            <div className="absolute inset-0 opacity-30" style={{backgroundImage:"url('https://www.transparenttextures.com/patterns/stardust.png')"}}></div>
                        </div>
                        <div onClick={handleOpen} className={`relative z-50 flex flex-col items-center justify-center cursor-pointer transition-all duration-700 ${inviteState !== 'sealed' ? 'opacity-0 scale-150 blur-md' : 'opacity-100 scale-100 hover:scale-105'}`}>
                            <div className="w-36 h-36 sm:w-44 sm:h-44 rounded-full gold-gradient-bg flex items-center justify-center shadow-[0_0_50px_rgba(212,175,55,0.4)] border-4 border-[#2d0a11] ring-2 ring-[#d4af37]">
                                <span className="font-serif-lux text-5xl sm:text-6xl text-[#2d0a11] font-bold tracking-wider">
                                    S<span className="font-script text-3xl mx-1">&</span>M
                                </span>
                            </div>
                            <p className="mt-8 font-sans-lux uppercase tracking-[0.3em] text-[#d4af37] text-sm animate-pulse flex items-center gap-2 font-bold">
                                <Sparkles size={14} /> Tap to Unseal <Sparkles size={14} />
                            </p>
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className={`transition-opacity duration-1000 delay-500 ${inviteState === 'opened' ? 'opacity-100 min-h-screen flex flex-col items-center justify-start p-3 sm:p-4 pt-16 pb-24' : 'opacity-0 h-screen overflow-hidden'}`}
                         style={{backgroundImage:"url('https://www.transparenttextures.com/patterns/stardust.png')"}}>

                        {inviteState === 'opened' && <GoldDust />}

                        {/* Close button */}
                        <div className={`fixed top-4 right-4 z-40 transition-all duration-1000 delay-1000 ${inviteState === 'opened' ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-10 pointer-events-none'}`}>
                            <button onClick={handleClose} className="p-3 rounded-full bg-[#2d0a11] border border-[#d4af37]/50 text-[#d4af37] hover:bg-[#d4af37] hover:text-[#2d0a11] transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)]" aria-label="Close">
                                <X size={20} />
                            </button>
                        </div>

                        {/* Invitation Image Card */}
                        <div className="relative z-20 max-w-xl w-full mx-auto shadow-[0_20px_50px_rgba(0,0,0,0.8)] rounded-xl overflow-hidden border-4 sm:border-[6px] border-[#d4af37] bg-[#2d0a11] mt-12 sm:mt-10 opacity-0 animate-fade-in-up" style={{animationDelay:'0.8s'}}>
                            <img
                                src="https://i.postimg.cc/L5gr9gYx/1781020647058.png"
                                onError={(e) => { e.target.onerror=null; e.target.src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=1000&auto=format&fit=crop"; }}
                                alt="Swathi & Mohan Kumar Wedding Invitation"
                                className="w-full h-auto object-cover block relative z-10"
                            />
                        </div>

                        {/* Countdown + Calendar */}
                        <div className="w-full max-w-xl mt-8 sm:mt-12 opacity-0 animate-fade-in-up space-y-4 sm:space-y-6 relative z-20" style={{animationDelay:'1.0s'}}>

                            {/* Countdown */}
                            <div className="bg-[#091f24] border border-[#d4af37]/30 rounded-[20px] sm:rounded-[30px] p-5 sm:p-8 text-center glow-box relative overflow-hidden">
                                <div className="absolute inset-0 opacity-20" style={{backgroundImage:"url('https://www.transparenttextures.com/patterns/stardust.png')"}}></div>
                                <h3 className="font-serif-lux text-lg sm:text-2xl mb-4 sm:mb-6 text-[#d4af37] relative z-10">The Countdown</h3>
                                <div className="flex flex-wrap justify-center gap-4 sm:gap-8 font-serif-lux relative z-10">
                                    {[
                                        {label:'Days',    value:timeLeft.days},
                                        {label:'Hours',   value:timeLeft.hours},
                                        {label:'Minutes', value:timeLeft.minutes},
                                        {label:'Seconds', value:timeLeft.seconds},
                                    ].map((item, idx) => (
                                        <div key={idx} className="flex flex-col items-center w-14 sm:w-16">
                                            <div className="text-3xl sm:text-4xl text-[#d4af37] mb-1 font-bold">{String(item.value).padStart(2,'0')}</div>
                                            <div className="text-[10px] sm:text-xs font-sans-lux uppercase tracking-[0.2em] text-[#d4af37]/70">{item.label}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Calendar */}
                            <div className="bg-[#2d0a11]/80 border border-[#d4af37]/30 rounded-[20px] sm:rounded-[30px] p-5 sm:p-8 text-center backdrop-blur-sm glow-box">
                                <h3 className="font-serif-lux text-2xl sm:text-3xl mb-1 sm:mb-2 text-[#d4af37]">June 2026</h3>
                                <p className="font-sans-lux text-[#d4af37]/70 text-[10px] sm:text-xs tracking-[0.2em] mb-4 sm:mb-6 uppercase">Mark Your Calendar</p>
                                <div className="max-w-[280px] mx-auto">
                                    <div className="grid grid-cols-7 gap-1 sm:gap-2 mb-2 sm:mb-3 font-serif-lux text-[#d4af37]/50 text-[10px] sm:text-xs tracking-widest">
                                        {['S','M','T','W','T','F','S'].map((d,i)=><div key={i}>{d}</div>)}
                                    </div>
                                    <div className="grid grid-cols-7 gap-y-2 sm:gap-y-3 gap-x-1 sm:gap-x-2 font-sans-lux text-sm sm:text-base text-[#d4af37]">
                                        <div></div>
                                        {[...Array(30)].map((_,i) => {
                                            const day = i+1;
                                            const isEvent = day===23||day===24;
                                            return (
                                                <div key={day} className={`h-8 w-8 sm:h-10 sm:w-10 mx-auto flex items-center justify-center rounded-full relative group transition-all duration-300 ${isEvent ? 'gold-gradient-bg text-[#2d0a11] font-bold shadow-[0_0_10px_rgba(212,175,55,0.6)] scale-110' : 'hover:bg-[#d4af37]/10'}`}>
                                                    {day}
                                                    {isEvent && (
                                                        <span className="absolute -top-8 left-1/2 -translate-x-1/2 bg-[#091f24] text-[#d4af37] text-[9px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap border border-[#d4af37]/30 pointer-events-none z-10">
                                                            {day===23?'Reception':'Muhurtham'}
                                                        </span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="flex justify-center items-center gap-6 mt-6 sm:mt-8 font-sans-lux text-xs sm:text-sm text-[#d4af37]/80">
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full gold-gradient-bg"></div><span>23rd – Reception</span></div>
                                    <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full gold-gradient-bg"></div><span>24th – Muhurtham</span></div>
                                </div>
                            </div>
                        </div>

                        {/* Venue */}
                        <div className="w-full max-w-xl mt-6 sm:mt-8 opacity-0 animate-fade-in-up relative z-20" style={{animationDelay:'1.2s'}}>
                            <div className="bg-[#2d0a11]/80 border border-[#d4af37]/30 rounded-[20px] sm:rounded-3xl p-6 sm:p-8 text-center backdrop-blur-sm glow-box relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 gold-gradient-bg"></div>
                                <div className="w-14 h-14 mx-auto rounded-full bg-[#091f24] border border-[#d4af37]/50 flex items-center justify-center mb-4 sm:mb-6">
                                    <MapPin className="text-[#d4af37]" size={22} />
                                </div>
                                <h3 className="font-serif-lux text-2xl sm:text-3xl mb-2 sm:mb-3 text-[#d4af37]">Wedding Venue</h3>
                                <p className="font-sans-lux text-[#d4af37]/80 text-sm sm:text-base mb-6 sm:mb-8 leading-relaxed">
                                    <strong>Sri Hari Convention Hall</strong><br/>
                                    Chikka Tirupati, Karnataka
                                </p>
                                <div className="flex flex-col sm:flex-row gap-3 justify-center items-center w-full">
                                    <input
                                        type="text"
                                        placeholder="Enter starting location (e.g., Sarjapur)"
                                        value={startLocation}
                                        onChange={e => setStartLocation(e.target.value)}
                                        onKeyDown={e => e.key==='Enter' && handleGetDirections()}
                                        className="bg-[#091f24] border border-[#d4af37]/50 text-[#d4af37] px-5 py-3 sm:py-4 rounded-full text-xs w-full focus:outline-none focus:border-[#d4af37] transition-all"
                                        style={{color:'#d4af37'}}
                                    />
                                    <button
                                        onClick={handleGetDirections}
                                        className="inline-flex items-center justify-center gap-2 px-8 py-3 sm:py-4 font-serif-lux tracking-[0.2em] text-xs uppercase text-[#2d0a11] font-bold gold-gradient-bg rounded-full hover:scale-105 transition-transform shadow-[0_4px_15px_rgba(212,175,55,0.3)] w-full sm:w-auto whitespace-nowrap"
                                    >
                                        <Navigation size={14} /> Route
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
